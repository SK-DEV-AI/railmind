<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RailMind Companion</title>
<link rel="stylesheet" href="overlay.css">
<style>
  body { width: 380px; margin: 0; padding: 10px; font-family: system-ui, sans-serif; font-size: 13px; }
  h3 { margin: 8px 0 4px; font-size: 13px; }
  input[type=text] { width: 100%; padding: 6px; border: 1px solid #d0d7de; border-radius: 6px; }
  button { padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button.primary { background: #0969da; color: #fff; border-color: #0969da; }
  .row { display:flex; gap:6px; align-items:center; margin: 6px 0; }
  .card { border:1px solid #e1e4e8; border-radius:8px; padding:8px; margin:6px 0; background:#f6f8fa; }
  .muted { color:#57606a; font-size:11px; }
  #results { max-height: 260px; overflow: auto; }
  .it { cursor:pointer; }
  .it:hover { background:#eaeef2; }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; font-weight:600; }
  .rm-low{background:#dafbe1;color:#1a7f37;}
  .rm-medium{background:#fff8c5;color:#9a6700;}
  .rm-high{background:#ffebe9;color:#cf222e;}
  .rm-unknown{background:#eaeef2;color:#57606a;}
</style>
</head>
<body>
  <div class="rm-title" style="font-weight:700;font-size:14px;margin-bottom:6px;">RailMind Companion</div>
  <div class="muted">Backend URL</div>
  <div class="row">
    <input type="text" id="backend" placeholder="http://127.0.0.1:8000">
    <button id="saveBackend">Save</button>
  </div>
  <div class="muted" id="health">—</div>

  <h3>Journey</h3>
  <input type="text" id="query" placeholder="mumbai to pune tomorrow 3AC tatkal">
  <div class="row" style="margin-top:6px;">
    <button class="primary" id="searchBtn">Search</button>
    <button id="clearBtn">Clear stored</button>
  </div>
  <div id="status" class="muted"></div>
  <div id="results"></div>

  <script src="lib/selectors.js"></script>
  <script src="lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
